# gunicorn（Flask アプリ）へのリバースプロキシ設定
# /etc/nginx/sites-available/todo.conf へ配置し、sites-enabled からリンクする（deploy/setup.sh が行う）
#
# WebSocket 用の設定（proxy_http_version 1.1、Upgrade / Connection ヘッダの転送）は持たない
# このアプリはブラウザとの常時接続を張らず、通常の HTTP の要求と応答だけで動く
# 転送しないヘッダのために変数を用意する必要もないため、map も置かない

server {
    # 既定のサイト（/etc/nginx/sites-enabled/default）は setup.sh が無効化する
    # 両方が default_server を宣言すると nginx -t が失敗する
    listen 80 default_server;
    server_name _;

    location / {
        # gunicorn は 127.0.0.1:8000 だけで待ち受ける
        proxy_pass http://127.0.0.1:8000;

        # 同じホスト内への接続なので、確立に時間はかからない
        # 短くしておくと gunicorn が停止しているときに 502 がすぐ返り、原因の切り分けが速くなる
        proxy_connect_timeout 5s;

        # ブラウザが送った情報をそのままアプリへ渡す
        # 既定では Host が proxy_pass の宛先（127.0.0.1:8000）に書き換わり、アプリからは本来のアクセス先も接続元 IP も分からなくなる
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 停止した Azure SQL Database の再開を待つ間、アプリは応答を返さない
        # 待ち時間は最悪 140 秒になるため、既定の 60 秒では nginx が先に諦めて 504 を返す
        # gunicorn の --timeout 150 だけ延ばしても、手前の nginx が切ってしまうため意味がない
        # 「アプリ 140 秒 < gunicorn 150 秒 < nginx 180 秒」の順に長くする
        # 同じ値にすると、どちらが先に切ったのか判別できない
        proxy_read_timeout 180s;
    }
}
