# Streamlit へのリバースプロキシ設定です。
# /etc/nginx/sites-available/todo.conf へ配置し、sites-enabled からリンクします
# （deploy/setup.sh が行います）。

# Upgrade ヘッダの有無で Connection ヘッダの値を切り替えます。
# WebSocket の要求には upgrade を、通常の HTTP 要求には close を送ります。
# map は http コンテキストの命令です。sites-enabled 配下は nginx.conf の
# http ブロック内で include されるため、このファイルの先頭に書けます。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # 既定のサイト（/etc/nginx/sites-enabled/default）は setup.sh が無効化します。
    # 両方が default_server を宣言すると nginx -t が失敗します
    listen 80 default_server;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8501;

        # WebSocket のアップグレードには HTTP/1.1 が必要です。
        # proxy_pass の既定は HTTP/1.0 で、Upgrade を扱えません
        proxy_http_version 1.1;

        # Streamlit はブラウザとの間を WebSocket で常時接続します。
        # この 2 行がないとアップグレードが成立せず、画面が更新されません
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Streamlit は Host ヘッダで同一オリジンかどうかを判定します。
        # 127.0.0.1:8501 に書き換えると XSRF 対策で WebSocket が拒否されます
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 画面を操作しない時間が続くと、既定の 60 秒で WebSocket が切断されます
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
