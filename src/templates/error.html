<!-- templates/error.html -->
<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo アプリ</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>

<body class="bg-gray-100 min-h-screen">
  <div class="container mx-auto px-4 py-8 max-w-2xl">
    <h1 class="text-3xl font-bold text-gray-800 mb-8 text-center">Todoリスト</h1>

    <!-- 例外の詳細は表示しません。ODBC のエラーメッセージにはサーバー名や
         ユーザー名が含まれるため、対処法だけを案内します -->
    <div class="bg-white p-6 rounded-lg shadow-sm">
      <p class="px-4 py-3 rounded-lg bg-red-100 border border-red-300 text-red-700">
        {{ message }}
      </p>
      <a href="{{ url_for('index') }}"
        class="inline-block mt-4 px-6 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors duration-200">
        再読み込み
      </a>
    </div>
  </div>
</body>

</html>
